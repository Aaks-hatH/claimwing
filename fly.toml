# Fly.io config. Run `fly launch --no-deploy` to set your own app name and region.
app = "claimwing"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  INTERNAL_CRON = "true"
  STORAGE_DRIVER = "gridfs"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
