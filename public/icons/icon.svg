<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Vola">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1B3D"/>
      <stop offset="0.55" stop-color="#070F26"/>
      <stop offset="1" stop-color="#03060F"/>
    </linearGradient>
    <radialGradient id="auroraA" cx="0.82" cy="0.12" r="0.65">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB" cx="0.1" cy="1" r="0.8">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vL" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="vR" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#fff" stroke-opacity="0.045" stroke-width="2"/>
    </pattern>
    <clipPath id="sq"><rect width="1024" height="1024" rx="240"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="240" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#auroraA)"/>
    <rect width="1024" height="1024" fill="url(#auroraB)"/>
    <rect width="1024" height="1024" fill="url(#grid)"/>
    <ellipse cx="512" cy="1010" rx="420" ry="90" fill="#22D3EE" opacity="0.18" filter="url(#glow)"/>
  </g>
  <!-- glow layer -->
  <g filter="url(#glow)" opacity="0.8">
    <path d="M270 300 L470 740" stroke="#3B82F6" stroke-width="110" stroke-linecap="round" fill="none"/>
    <path d="M470 740 L780 262" stroke="#22D3EE" stroke-width="110" stroke-linecap="round" fill="none"/>
  </g>
  <!-- V: left arm and longer right arm -->
  <path d="M270 300 L470 740" stroke="url(#vL)" stroke-width="104" stroke-linecap="round" fill="none"/>
  <path d="M470 740 L780 262" stroke="url(#vR)" stroke-width="104" stroke-linecap="round" fill="none"/>
  <!-- node -->
  <circle cx="808" cy="222" r="64" fill="#031024" stroke="#A7F3D0" stroke-width="10"/>
  <circle cx="808" cy="222" r="26" fill="#A7F3D0"/>
  <circle cx="808" cy="222" r="96" fill="none" stroke="#A7F3D0" stroke-opacity="0.35" stroke-width="3"/>
  <circle cx="808" cy="222" r="136" fill="none" stroke="#A7F3D0" stroke-opacity="0.16" stroke-width="3"/>
  <!-- glass rim -->
  <rect x="4" y="4" width="1016" height="1016" rx="236" fill="none" stroke="url(#rim)" stroke-width="8"/>
</svg>
