<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Vola</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 0%,#16294a,#070F26 60%);color:#EAF1FB;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:420px;text-align:center}
  img{width:88px;height:88px;border-radius:22px;margin-bottom:24px}
  h1{font-size:26px;margin:0 0 10px}
  p{color:#9FB2CE;line-height:1.55;margin:0 0 22px}
  button{background:#22D3EE;color:#03111f;border:0;border-radius:12px;padding:13px 22px;font-size:16px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="Vola">
  <h1>You are offline</h1>
  <p>Vola needs a connection to track flights and load your trips. Your saved photos and claims are safe on the server. Reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
